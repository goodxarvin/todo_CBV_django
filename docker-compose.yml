version: '3.8'

services:
  todo_web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"

  redis:
    image: redis:latest

    container_name: redis

    restart: always


  worker:
    build: 
      context: .
      dockerfile: Dockerfile

    depends_on:
      - todo_web
      - redis


