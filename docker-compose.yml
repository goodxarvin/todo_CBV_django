version: '3.8'

services:
  todo_web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"

    volumes:
      - static_volume:/app/static/
      - media_volume:/app/media/

  redis:
    image: redis:latest

    container_name: redis

    restart: always
  

  worker:
    build: 
      context: .
      dockerfile: Dockerfile

    depends_on:
      - todo_web
      - redis

  nginx:
    image: nginx:latest

    restart: "always"

    container_name: "nginx"

    ports:
      - "80:80"
    
    depends_on:
      - redis
      - todo_web

    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/static/
      - media_volume:/home/app/media/




volumes:
  static_volume:
  media_volume:


