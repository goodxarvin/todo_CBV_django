version: '3.8'

services:
  todo_web:
    env_file:
      - .env.example.prod_todo_web
    command: ["./command.sh"]
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: todo_db
    restart: always
    env_file:
      - .env.db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  worker:
    command: python -m celery -A todo_core worker

volumes:
  postgres_data:


